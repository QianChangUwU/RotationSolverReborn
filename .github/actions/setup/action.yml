name: Set up RSR build
description: Install .NET, Dalamud and the compiler required by the source generators
inputs:
  dalamud-url:
    description: Dalamud distribution URL
    default: https://goatcorp.github.io/dalamud-distrib/latest.zip
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Set up dependencies
      shell: pwsh
      env:
        DALAMUD_URL: ${{ inputs.dalamud-url }}
      run: |
        $ErrorActionPreference = 'Stop'
        $root = Join-Path $env:RUNNER_TEMP 'rsr-build'
        New-Item -ItemType Directory -Force $root | Out-Null
        Invoke-WebRequest $env:DALAMUD_URL -OutFile "$root/dalamud.zip"
        Expand-Archive "$root/dalamud.zip" "$root/dalamud" -Force
        if (!(Test-Path "$root/dalamud/Dalamud.dll")) { throw 'Dalamud.dll is missing' }
        "DALAMUD_HOME=$root/dalamud" >> $env:GITHUB_ENV
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
          <ItemGroup><PackageReference Include="Microsoft.Net.Compilers.Toolset" Version="5.9.0" /></ItemGroup>
        </Project>
        '@ | Set-Content "$root/Compiler.csproj"
        dotnet restore "$root/Compiler.csproj" --packages "$root/packages"
        if ($LASTEXITCODE -ne 0) { throw 'Compiler restore failed' }
        "RSR_COMPILER_PROPS=$root/packages/microsoft.net.compilers.toolset/5.9.0/build/Microsoft.Net.Compilers.Toolset.props" >> $env:GITHUB_ENV
